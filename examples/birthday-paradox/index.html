<script>
/* ================= 配置 ================= */

/* 旁白字幕：[起, 止, 中文, 英文] */
const SUBTITLES = [

const TITLE_CARD = [13, 20];
const SECTIONS = [
  [0, '生日问题 · THE BIRTHDAY PROBLEM', ''],
  [13, '', ''],
  [20, '1939 · 伊斯坦布尔 · ISTANBUL', '图为示意'],
  [37, '', ''],
  [40, '规则 · THE RULES', '假设：365 天等概率 · 忽略闰日与双胞胎'],
  [47.5, '第 1 次实验 · TRIAL 01', '模拟'],
  [63.5, '1000 次重复 · 1,000 ROOMS', '模拟数据'],
  [72, '同一个问题，六个数', '模拟 510/1000 · 理论 50.7%'],
  [82, '理论曲线 · THE CURVE', '公式计算'],
  [90, '253 对 · 253 PAIRS', 'C(23,2) = 253'],
  [100, '你算的是哪一问？', '同版式对照'],
  [107.5, '253 对 · 253 PAIRS', '红 = 你自己的 22 对 · 金 = 其余 231 对'],
  [110, '教室 · 群聊 · 婚礼', '同一套规则'],
  [120, '收尾 · OUTRO', ''],
  [124.5, '', ''],
];

/* ================= 工具 ================= */
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp  = (a,b,t)=>a+(b-a)*t;
const easeInOut = t => t<.5 ? 2*t*t : 1-((-2*t+2)**2)/2;
const easeOut = t => 1-(1-t)**3;
const easeIn = t => t*t*t;
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14)>>>0)/4294967296; }; }
function roundRect(c,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function rgba(hex,a){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function starPath(c,x,y,r,spikes,inner){ c.beginPath(); for(let i=0;i<spikes*2;i++){ const rr=i%2?inner:r; const a=i*Math.PI/spikes-Math.PI/2; c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} c.closePath(); }

const SIM = {"seed": 11, "count": 510, "total": 1000, "firstDays": [187, 194, 222, 216, 311, 197, 30, 194, 222, 165, 176, 308, 154, 245, 249, 59, 66, 101, 145, 138, 213, 47, 218], "firstCollisions": [[1, 7, 194], [2, 8, 222]]};
const SIM_FLAGS = "1111101001001011110011100111111100001011110001101001100100110010001111100110101111101011000111000101100100110110011111000101110111100011000011011100000111111011101111101100100111101000111111101100111110101111000001100101010101001010100110100111100100001111010111101111000100010101100000011110101000010110110101000000110100010110010100110010100001011010101111100111001110001100100010001100101010001101000000101101101101101110001100100100111110001000101000011001110100110000100110001000100010110110010001000110111101110010100000101110001111101110100101000010110001010010101011101011101001001101111111101010010010110110100110010101000110000100001111110111011100000001100011011011101001110001101110111111111011011111010100001011011010001100100000011000001111000100001110110011110000011111110011011101101000111100100111000000100100100010100011001001111101100100011000010101111111100110001011101110111010010011000010001011110110100101101111101111101000000010011110100001010100110000100100111100010000010001";
const SIM_PREFIX = (()=>{const a=[0];for(let i=0;i<SIM_FLAGS.length;i++)a.push(a[i]+(SIM_FLAGS.charCodeAt(i)===49?1:0));return a;})();


/* ================= 模拟数据与画布 ================= */
const DAYS = SIM.firstDays.slice();
const COLLS = SIM.firstCollisions.map(([a,b,day])=>({a,b,day}));
const PAIRS = (()=>{ const out=[]; for(let i=0;i<23;i++) for(let j=i+1;j<23;j++) out.push([i,j]); return out; })();
const YOU = 0;

const cvBG = document.getElementById('bg'), ctBG = cvBG.getContext('2d');
const cvScene = document.getElementById('scene'), ctScene = cvScene.getContext('2d');
const starRnd = mulberry32(20261031);
const STARS = Array.from({length:120},()=>({x:starRnd()*1920,y:starRnd()*1080,r:starRnd()*1.5+.25,p:starRnd()*Math.PI*2,s:starRnd()*.35+.15}));
const DUST = Array.from({length:34},()=>({x:starRnd()*1920,y:starRnd()*760,r:starRnd()*2+.6,p:starRnd()*Math.PI*2,s:starRnd()*.5+.25}));

/* 背景：深蓝黑 + 极淡星点 + 暗角 */
function drawBG(t){
  ctBG.clearRect(0,0,1920,1080);
  const g = ctBG.createRadialGradient(960,470,80, 960,470,1250);
  g.addColorStop(0,'#10102A'); g.addColorStop(.48,'#090918'); g.addColorStop(1,'#04040C');
  ctBG.fillStyle = g; ctBG.fillRect(0,0,1920,1080);

  for(const s of STARS){
    const a = .18 + .42*Math.abs(Math.sin(t*.55 + s.p));
    ctBG.fillStyle = `rgba(224,228,246,${a})`;
    ctBG.beginPath(); ctBG.arc(s.x,s.y,s.r,0,Math.PI*2); ctBG.fill();
  }
  for(const d of DUST){
    const x = d.x + Math.sin(t*.18+d.p)*18;
    const y = d.y + Math.cos(t*.12+d.p)*10;
    ctBG.fillStyle = `rgba(201,169,106,${.05 + .05*Math.abs(Math.sin(t*.4+d.p))})`;
    ctBG.beginPath(); ctBG.arc(x,y,d.r,0,Math.PI*2); ctBG.fill();
  }
  const v = ctBG.createRadialGradient(960,500,420, 960,500,1180);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
  ctBG.fillStyle = v; ctBG.fillRect(0,0,1920,1080);

  /* 片名卡暗场里留两颗金点，成为全片记忆 */
  if(t>=13 && t<20){
    const a = .12 + .10*Math.abs(Math.sin((t-13)*.7));
    goldGlow(ctBG, 760, 510, 600, a, '#C9A96A');
    goldGlow(ctBG, 1180, 590, 520, a*.8, '#C9A96A');
  }
  if(t>=120){
    const k = clamp((t-120)/2.0,0,1);
    goldGlow(ctBG, 820, 380, 340, .08*k, '#C9A96A');
    goldGlow(ctBG, 1100, 620, 300, .07*k, '#C9A96A');
  }
}

function goldGlow(c,x,y,r,a,color){
  const g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(color,a)); g.addColorStop(.35,rgba(color,a*.35)); g.addColorStop(1,rgba(color,0));
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
}

/* ================= 通用纸艺与标注 ================= */
function paperTexture(c,w,h,a=1){
  const g = c.createLinearGradient(-w/2,-h/2,w/2,h/2);
  g.addColorStop(0,`rgba(255,252,240,${.24*a})`); g.addColorStop(.55,`rgba(237,228,211,${.04*a})`);
  g.addColorStop(1,`rgba(124,102,72,${.10*a})`);
  c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h);
  c.strokeStyle=`rgba(90,72,48,${.10*a})`; c.lineWidth=1;
  for(let i=0;i<7;i++){
    const yy=-h/2+8+i*h/7;
    c.beginPath(); c.moveTo(-w/2+8,yy); c.lineTo(w/2-8,yy); c.stroke();
  }
}

function drawPaperCard(c,x,y,w,h,num,day,opt={}){
  const rot=opt.rot||0, alpha=opt.alpha??1;
  c.save(); c.globalAlpha*=alpha; c.translate(x,y); c.rotate(rot);
  c.shadowColor='rgba(0,0,0,.55)'; c.shadowBlur=opt.shadow??20; c.shadowOffsetY=7;
  c.fillStyle='#EDE4D3'; roundRect(c,-w/2,-h/2,w,h,Math.min(6,w/10)); c.fill();
  c.shadowColor='transparent';
  paperTexture(c,w,h,.7);
  c.strokeStyle='rgba(70,52,30,.20)'; c.lineWidth=1; roundRect(c,-w/2+5,-h/2+5,w-10,h-10,3); c.stroke();

  const compact = w < 46;
  if(!compact){
    const hx=0, hy=-h*.20, hr=Math.min(w,h)*.11;
    c.fillStyle='rgba(74,58,39,.56)';
    c.beginPath(); c.arc(hx,hy,hr,0,Math.PI*2); c.fill();
    c.beginPath(); c.moveTo(-hr*1.55,hy+hr*2.1); c.quadraticCurveTo(0,hy+hr*.62,hr*1.55,hy+hr*2.1); c.closePath(); c.fill();
    c.font=`500 ${Math.max(12,w*.145)}px 'Noto Sans SC'`; c.fillStyle='rgba(74,58,39,.62)';
    c.textAlign='left'; c.textBaseline='top'; c.fillText('#'+String(num).padStart(2,'0'),-w/2+10,-h/2+8);
    c.font=`900 ${Math.max(16,w*.24)}px 'Noto Serif SC'`; c.fillStyle='#3A2E20';
    c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(day),0,h*.26);
    c.font=`500 ${Math.max(9,w*.09)}px 'Noto Sans SC'`; c.fillStyle='rgba(74,58,39,.45)';
    c.fillText('BIRTH DATE',0,h*.26+Math.max(15,w*.16));
  } else {
    c.font=`900 ${Math.max(8,w*.34)}px 'Noto Serif SC'`; c.fillStyle='#3A2E20';
    c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(day),0,1);
    c.font=`500 ${Math.max(6,w*.20)}px 'Noto Sans SC'`; c.fillStyle='rgba(74,58,39,.50)';
    c.textAlign='left'; c.textBaseline='top'; c.fillText('#'+num,-w/2+3,-h/2+2);
  }
  if(opt.gold){
    c.shadowColor=rgba('#C9A96A',.8); c.shadowBlur=18;
    c.strokeStyle=rgba('#C9A96A',.9); c.lineWidth=Math.max(2,w*.035);
    roundRect(c,-w/2-2,-h/2-2,w+4,h+4,3); c.stroke(); c.shadowColor='transparent';
  }
  c.restore();
}

function drawSeal(c,x,y,text,opt={}){
  const rot=opt.rot??-.08, s=opt.scale??1, a=opt.alpha??1, color=opt.color||CFG.accent;
  c.save(); c.globalAlpha*=a; c.translate(x,y); c.rotate(rot); c.scale(s,s);
  c.font=`900 ${opt.size||46}px 'Noto Serif SC'`; c.textAlign='center'; c.textBaseline='middle';
  const tw=c.measureText(text).width; const w=tw+44, h=(opt.size||46)+34;
  roundRect(c,-w/2,-h/2,w,h,4);
  c.fillStyle=rgba(color,.06); c.fill();
  c.strokeStyle=rgba(color,.86); c.lineWidth=3; c.stroke();
  roundRect(c,-w/2+6,-h/2+6,w-12,h-12,2);
  c.lineWidth=1.2; c.strokeStyle=rgba(color,.55); c.stroke();
  c.fillStyle=color; c.fillText(text,0,2);
  c.restore();
}

function drawPanel(c,x,y,w,h,opt={}){
  c.save(); c.globalAlpha*=opt.alpha??1;
  roundRect(c,x,y,w,h,10);
  c.fillStyle=opt.fill||'rgba(10,10,26,.66)'; c.fill();
  c.strokeStyle=opt.stroke||'rgba(201,169,106,.24)'; c.lineWidth=1.2; c.stroke();
  c.restore();
}

function drawRuleCard(c,t,x,y,w,h){
  const active = t<42.5?1:(t<45?2:3);
  c.save(); c.translate(x,y); c.rotate(-.025);
  c.shadowColor='rgba(0,0,0,.5)'; c.shadowBlur=28; c.shadowOffsetY=10;
  c.fillStyle='#EDE4D3'; roundRect(c,-w/2,-h/2,w,h,8); c.fill();
  c.shadowColor='transparent'; paperTexture(c,w,h,.8);
  c.strokeStyle='rgba(70,52,30,.22)'; c.lineWidth=1; roundRect(c,-w/2+7,-h/2+7,w-14,h-14,4); c.stroke();

  c.fillStyle='#3A2E20'; c.textAlign='left'; c.textBaseline='top';
  c.font="900 30px 'Noto Serif SC'"; c.fillText('游戏规则',-w/2+28,-h/2+24);
  c.font="500 13px 'Noto Sans SC'"; c.fillStyle='rgba(58,46,32,.55)'; c.fillText('THE RULES OF THE GAME',-w/2+29,-h/2+64);

  const rows=[
    ['①','365 天等概率','EVERY DAY EQUAL'],
    ['②','随机落格','LAND AT RANDOM'],
    ['③','同格 = 同一天','SAME SLOT = SAME DAY'],
  ];
  rows.forEach((r,i)=>{
    const yy=-h/2+105+i*86;
    const on=i<active;
    c.globalAlpha = on?1:.25;
    const glow=on?(1+.25*Math.abs(Math.sin(t*1.3+i))):0;

/* 右侧 0–100% 概率表：竖直刻度，50% 金线 */
function drawGauge(c,x,y,w,h,target,opt={}){
  const a=opt.alpha??1, compact=opt.compact, valColor=opt.color||CFG.accent;
  c.save(); c.globalAlpha*=a;
  const trackX = x + w*.52, top=y+42, bot=y+h-30, span=bot-top;
  if(!compact){
    drawPanel(c,x-24,y-26,w+48,h+52,{alpha:.85,stroke:'rgba(201,169,106,.20)'});
    c.fillStyle=rgba('#C9A96A',.78); c.font="500 15px 'Noto Sans SC'"; c.textAlign='left'; c.textBaseline='top';
    c.fillText('至少一对同一天',x,y-16);
    c.fillStyle='rgba(138,138,160,.7)'; c.font="500 10px 'Noto Sans SC'";
    c.fillText('PROBABILITY',x,y+3);
  }
  const ty = bot - clamp(target,0,100)/100*span;
  const gr=c.createLinearGradient(trackX,top, trackX,bot);
  gr.addColorStop(0, rgba('#C9A96A',.7)); gr.addColorStop(.5,rgba('#7FA6C8',.36)); gr.addColorStop(1,rgba('#7FA6C8',.08));
  roundRect(c,trackX-5,top,10,span,5); c.fillStyle='rgba(20,22,42,.78)'; c.fill();
  c.strokeStyle='rgba(201,169,106,.22)'; c.lineWidth=1; c.stroke();

  for(let p=0;p<=100;p+=10){
    const yy=bot-p/100*span;
    const major=p%20===0;
    c.strokeStyle=`rgba(138,138,160,${major?.32:.12})`;
    c.lineWidth=1; c.beginPath(); c.moveTo(trackX-13,yy); c.lineTo(trackX+13,yy); c.stroke();
    if(major && !compact){
      c.fillStyle='rgba(138,138,160,.62)'; c.font="400 11px 'Noto Sans SC'"; c.textAlign='right'; c.textBaseline='middle';
      c.fillText(p+'%',trackX-23,yy);
    }
  }
  const y50=bot-0.5*span;
  c.strokeStyle=rgba('#C9A96A',.55); c.lineWidth=1.3; c.setLineDash([6,5]);
  c.beginPath(); c.moveTo(trackX-20,y50); c.lineTo(trackX+24,y50); c.stroke(); c.setLineDash([]);
  c.fillStyle=rgba('#C9A96A',.8); c.font="500 12px 'Noto Sans SC'"; c.textAlign='left'; c.textBaseline='middle';
  c.fillText('50%',trackX+28,y50-9);

  const pulse=.55+.45*Math.abs(Math.sin(performanceSafeTime()*.9));
  goldGlow(c,trackX,ty,compact?18:30,.16*pulse,valColor);
  c.fillStyle=valColor; c.beginPath(); c.arc(trackX,ty,compact?4.5:6,0,Math.PI*2); c.fill();
  c.strokeStyle=rgba('#F1D9A8',.7); c.lineWidth=1; c.stroke();
  c.strokeStyle=rgba('#C9A96A',.55); c.lineWidth=1;
  c.beginPath(); c.moveTo(trackX,y50); c.lineTo(trackX,ty); c.stroke();

  if(!compact){
    c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle=valColor; c.font="900 46px 'Noto Serif SC'";
    c.fillText(target.toFixed(1)+'%',x+w*.40,y+46);
    c.fillStyle='rgba(138,138,160,.8)'; c.font="500 12px 'Noto Sans SC'";
    c.fillText(opt.sub||'',x+w*.40,y+78);
  }
  c.restore();
}

/* 当前渲染时间（保证 render(t) 纯函数：绘制只读这个变量） */
let NOW=0;
function performanceSafeTime(){ return NOW; }

/* ================= 365 格生日旅馆墙 ================= */
function wallCell(layout,day){
  const i=day-1, col=i%25, row=Math.floor(i/25);
  return {
    x:layout.x + col*(layout.cw+layout.gx),
    y:layout.y + row*(layout.ch+layout.gy),
    cw:layout.cw, ch:layout.ch
  };
}
function drawWall(c,t,L={}){
  const x=L.x??470, y=L.y??140, cw=L.cw??42, ch=L.ch??36, gx=L.gx??5, gy=L.gy??5;
  const a=L.alpha??1;
  const lit=L.litDays||null, gold=L.goldDays||null, all=L.allLit;
  c.save(); c.globalAlpha*=a;
  for(let day=1;day<=375;day++){
    const col=(day-1)%25, row=Math.floor((day-1)/25);
    const px=x+col*(cw+gx), py=y+row*(ch+gy);
    const valid=day<=365;
    const isLit=all || (lit && lit.has(day));
    const isGold=gold && gold.has(day);
    const breath=.5+.5*Math.sin(t*.8 + day*.17);
    roundRect(c,px,py,cw,ch,Math.max(2,cw*.07));
    if(!valid){
      c.fillStyle='rgba(127,166,200,.012)'; c.fill();
      c.strokeStyle='rgba(127,166,200,.035)'; c.lineWidth=.7; c.stroke();
    } else if(isGold){
      c.fillStyle=rgba('#C9A96A',.30+.12*breath); c.fill();
      c.shadowColor=rgba('#C9A96A',.65); c.shadowBlur=14+8*breath;
      c.strokeStyle=rgba('#F1D9A8',.85); c.lineWidth=1.8; c.stroke(); c.shadowColor='transparent';
    } else if(isLit){
      c.fillStyle=rgba('#7FA6C8',.18+.10*breath); c.fill();
      c.strokeStyle=rgba('#7FA6C8',.58); c.lineWidth=1.1; c.stroke();
    } else {
      c.fillStyle=rgba('#7FA6C8',.105); c.fill();
      c.strokeStyle=rgba('#7FA6C8',.27); c.lineWidth=.8; c.stroke();
    }
  }
  c.restore();
}

function drawCollisionGlow(c,x,y,t,scale=1,alpha=1){
  const k=.7+.3*Math.abs(Math.sin(t*1.15));
  goldGlow(c,x,y,64*scale,.22*alpha*k,'#C9A96A');
  c.save(); c.globalAlpha*=alpha; c.strokeStyle=rgba('#C9A96A',.92); c.lineWidth=2.2;
  c.beginPath(); c.arc(x,y,25*scale,0,Math.PI*2); c.stroke();
  c.strokeStyle=rgba('#F1D9A8',.38); c.lineWidth=1;
  c.beginPath(); c.arc(x,y,33*scale,0,Math.PI*2); c.stroke();
  c.restore();
}

function drawRoomGrid(c,t,opt={}){
  const x0=opt.x??442, y0=opt.y??132, cw=opt.cw??20, ch=opt.ch??15, gx=opt.gx??4, gy=opt.gy??4;
  const alpha=opt.alpha??1, upto=opt.upto??1000;
  c.save(); c.globalAlpha*=alpha;
  for(let i=0;i<1000;i++){
    const col=i%40, row=Math.floor(i/40);
    const px=x0+col*(cw+gx), py=y0+row*(ch+gy);
    const on=i<upto;

    roundRect(c,px,py,cw,ch,2);

      const b=.5+.5*Math.sin(t*.8+i*.2);
      c.fillStyle=rgba('#C9A96A',.16+.10*b); c.fill();
      c.strokeStyle=rgba('#C9A96A',.65); c.lineWidth=.9; c.stroke();

      c.strokeStyle='rgba(127,166,200,.28)'; c.lineWidth=.7; c.stroke();
    }
  }
  c.restore();
}

})();

}

function drawHookWall(c,t,extraA=1){
  c.save(); c.globalAlpha*=extraA;
  const layout={x:470,y:150,cw:42,ch:36,gx:5,gy:5,alpha:1};
  const lit=new Set(DAYS), gold=new Set([194,222]);
  drawWall(c,t,{...layout,litDays:lit,goldDays:gold});

  /* 23 张纸卡：3.0s 起从座位飞进格子 */
  SEATS.forEach((seat,i)=>{
    const start=3.0+i*.035, dur=.78;
    const p=easeInOut(clamp((t-start)/dur,0,1));
    if(p<=0){
      const q=seatPos(seat);
      drawPaperCard(c,q.x,q.y-8,82,100,seat.n,DAYS[i],{rot:Math.sin(i*2.1)*.05,shadow:12});
      return;
    }
    const day=DAYS[i], cell=wallCell(layout,day);
    const tx=cell.x+cell.cw/2, ty=cell.y+cell.ch/2;
    const qx=seatPos(seat).x, qy=seatPos(seat).y-8;
    const x=lerp(qx,tx,p), y=lerp(qy,ty,p)-Math.sin(Math.PI*p)*175;
    const rot=lerp(Math.sin(i*2.1)*.10,0,p);
    const scl=lerp(.90,.34,p);
    const ga=c.globalAlpha;
    if(p<1) c.globalAlpha = ga*clamp(1-.15*p,0,1);
    drawPaperCard(c,x,y,82*scl,100*scl,seat.n,day,{rot,shadow:8,gold:gold.has(day)});
    c.globalAlpha=ga;
  });

  /* 落地后两处碰撞的连线 */
  if(t>4.5){
    const a=clamp((t-4.5)/1.0,0,1);
    const c1=wallCell(layout,194), c2=wallCell(layout,222);
    [[c1,1],[c2,2]].forEach(([cell,idx])=>{
      const cx=cell.x+cell.cw/2, cy=cell.y+cell.ch/2;
      drawCollisionGlow(c,cx,cy,t,1,a);
      c.save(); c.globalAlpha*=a; c.strokeStyle=rgba('#C9A96A',.7); c.lineWidth=1.4;
      c.beginPath(); c.moveTo(cx-12,cy); c.lineTo(cx+12,cy); c.stroke(); c.restore();
    });
    c.save(); c.globalAlpha*=a; c.font="500 15px 'Noto Sans SC'"; c.fillStyle=rgba('#C9A96A',.85);
    c.textAlign='center'; c.textBaseline='top';
    c.fillText('两天相撞',960,698); c.restore();
  }
  c.restore();
}

/* ================= 20–40s 文献复原：1939 伊斯坦布尔 ================= */
function drawPaperMiniWall(c,t,x,y,cw,ch,gx,gy){
  const litN=t>26?Math.min(23,Math.floor((t-26)/.11)+1):0;
  for(let day=1;day<=375;day++){
    const col=(day-1)%25, row=Math.floor((day-1)/25);
    const px=x+col*(cw+gx), py=y+row*(ch+gy);
    const valid=day<=365;
    const idx=DAYS.indexOf(day);
    const lit=idx>=0 && idx<litN;
    const gold=lit && (day===194||day===222);
    roundRect(c,px,py,cw,ch,1.2);
    if(!valid){ c.fillStyle='rgba(74,58,39,.025)'; c.fill(); }
    else if(gold){
      c.fillStyle='rgba(137,92,32,.52)'; c.fill(); c.strokeStyle='rgba(137,92,32,.82)'; c.lineWidth=1; c.stroke();
    } else if(lit){
      c.fillStyle='rgba(39,78,110,.34)'; c.fill(); c.strokeStyle='rgba(39,78,110,.58)'; c.lineWidth=.8; c.stroke();
    } else {
      c.fillStyle='rgba(74,58,39,.075)'; c.fill(); c.strokeStyle='rgba(74,58,39,.16)'; c.lineWidth=.6; c.stroke();
    }
  }
  if(litN>0){
    DAYS.slice(0,litN).forEach((day)=>{
      const col=(day-1)%25, row=Math.floor((day-1)/25);
      const px=x+col*(cw+gx)+cw/2, py=y+row*(ch+gy)+ch/2;
      c.fillStyle=(day===194||day===222)?'#C9A96A':'rgba(32,66,96,.92)';
      c.beginPath(); c.arc(px,py,1.9,0,Math.PI*2); c.fill();
    });
  }
}

function dayOccurrence(day,index){
  let occ=0;

}

function drawRuleStage(c,t){

  SEATS.forEach((s,i)=>{

function sideQueueX(i,n){

/* ================= 82–90s 理论曲线 ================= */
const PROBS = (()=>{ const a=[0]; let p=1; for(let n=1;n<=100;n++){ p*= (366-n)/365; a.push(1-p);} return a; })();
function prob(n){ return PROBS[clamp(n,0,100)]; }

const CURVE={x0:260,y0:652,x1:1450,ytop:170};
function curveX(n){ return CURVE.x0 + n/100*(CURVE.x1-CURVE.x0); }
function curveY(p){ return CURVE.y0 - p* (CURVE.y0-CURVE.ytop); }

function drawCurveChart(c,t){
  if(t<82 || t>=90.5) return;
  const a=clamp((t-82)/.6,0,1)*(1-clamp((t-89.6)/.9,0,1));
  if(a<=0) return;
  const nEnd=lerp(0,70,easeInOut(clamp((t-82)/3.0,0,1)));
  c.save(); c.globalAlpha*=a;

  /* 坐标轴 */
  c.strokeStyle='rgba(138,138,160,.28)'; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(CURVE.x0,CURVE.ytop-10); c.lineTo(CURVE.x0,CURVE.y0); c.lineTo(CURVE.x1,CURVE.y0); c.stroke();
  c.fillStyle='rgba(138,138,160,.66)'; c.font="500 14px 'Noto Sans SC'"; c.textAlign='center'; c.textBaseline='top';
  for(const n of [0,20,40,60,80,100]){
    const x=curveX(n);
    c.strokeStyle='rgba(138,138,160,.18)'; c.beginPath(); c.moveTo(x,CURVE.y0); c.lineTo(x,CURVE.y0+6); c.stroke();
    c.fillText(String(n),x,CURVE.y0+12);
  }
  c.textAlign='right'; c.textBaseline='middle';
  for(const p of [0,25,50,75,100]){
    const y=curveY(p/100);
    c.fillStyle='rgba(138,138,160,.62)'; c.fillText(p+'%',CURVE.x0-18,y);
    c.strokeStyle='rgba(138,138,160,.14)'; c.beginPath(); c.moveTo(CURVE.x0-10,y); c.lineTo(CURVE.x0,y); c.stroke();
  }
  c.textAlign='left'; c.textBaseline='top';
  c.fillStyle='rgba(138,138,160,.70)'; c.font="500 13px 'Noto Sans SC'";
  c.fillText('房间人数',CURVE.x0,CURVE.y0+38);
  c.save(); c.translate(CURVE.x0-88,curveY(.5)); c.rotate(-Math.PI/2);
  c.fillText('至少一对同一天',0,0); c.restore();

  /* 50% 金线 */
  const y50=curveY(.5072972343239857);
  c.strokeStyle=rgba('#C9A96A',.55); c.lineWidth=1.2; c.setLineDash([6,5]);
  c.beginPath(); c.moveTo(CURVE.x0+4,y50); c.lineTo(CURVE.x1,y50); c.stroke(); c.setLineDash([]);
  c.fillStyle=rgba('#C9A96A',.72); c.font="500 13px 'Noto Sans SC'"; c.textAlign='left';
  c.fillText('50.7%',CURVE.x0+8,y50-19);

  /* 曲线下方的淡金渐变 */
  const pts=[];
  for(let i=0;i<=Math.max(2,Math.floor(nEnd));i++){
    const n=i, p=prob(n);
    pts.push([curveX(n),curveY(p)]);
  }
  if(nEnd>0){
    c.beginPath(); c.moveTo(curveX(0),curveY(0));
    for(const [x,y] of pts) c.lineTo(x,y);
    c.lineTo(curveX(nEnd),CURVE.y0); c.closePath();
    const g=c.createLinearGradient(0,CURVE.ytop,0,CURVE.y0);
    g.addColorStop(0,'rgba(201,169,106,.02)'); g.addColorStop(1,'rgba(201,169,106,.10)');
    c.fillStyle=g; c.fill();

    c.save(); c.shadowColor=rgba('#C9A96A',.55); c.shadowBlur=18;
    c.strokeStyle=rgba('#E7CFA0',.94); c.lineWidth=2.4; c.beginPath();
    c.moveTo(pts[0][0],pts[0][1]);
    for(const [x,y] of pts) c.lineTo(x,y);
    c.stroke(); c.restore();
    const last=pts[pts.length-1];
    goldGlow(c,last[0],last[1],26,.2,'#C9A96A');
    c.fillStyle=CFG.accent; c.beginPath(); c.arc(last[0],last[1],5,0,Math.PI*2); c.fill();
  }

  /* 关键点 */
  const marks=[
    {n:23,p:prob(23),label:'23 人'},
    {n:30,p:prob(30),label:'30 人'},
    {n:70,p:prob(70),label:'70 人'},
  ];
  marks.forEach(m=>{
    if(nEnd<m.n-1) return;
    if(m.n===70 && t>=85) return;
    const x=curveX(m.n), y=curveY(m.p);
    const is70=m.n===70;
    c.fillStyle=is70?CFG.accent:rgba('#7FA6C8',.9);
    c.beginPath(); c.arc(x,y,is70?6:4,0,Math.PI*2); c.fill();
    c.fillStyle=is70?rgba('#C9A96A',.84):'rgba(138,138,160,.62)';
    c.font=`${is70?700:500} ${is70?17:12}px 'Noto Sans SC'`; c.textAlign='left'; c.textBaseline='bottom';
    c.fillText(m.label+' · '+(m.p*100).toFixed(1)+'%',x+9,y-8);
  });

  if(t>=85){
    const a70=clamp((t-85)/.5,0,1);
    const x=curveX(70), y=curveY(prob(70));
    c.save(); c.globalAlpha*=a70;
    c.strokeStyle=rgba('#C9A96A',.45); c.lineWidth=1.1; c.setLineDash([5,5]);
    c.beginPath(); c.moveTo(x,y); c.lineTo(x,CURVE.y0); c.stroke(); c.setLineDash([]);
    c.textAlign='right'; c.textBaseline='middle';
    c.fillStyle=CFG.accent; c.font="900 42px 'Noto Serif SC'";
    c.fillText('99.9%',x-14,y-26);
    c.fillStyle='rgba(138,138,160,.8)'; c.font="500 13px 'Noto Sans SC'";
    c.fillText('70 人 · 理论曲线',x-14,y-64);
    c.restore();
  }

  if(t>=87.4){
    const k=.65+.35*Math.abs(Math.sin((t-87.4)*1.5));
    c.save(); c.globalAlpha*=.75*k;
    c.fillStyle=CFG.accent; c.font="900 78px 'Noto Serif SC'"; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('?',curveX(35),curveY(.88)); c.restore();
  }
  c.fillStyle='rgba(138,138,160,.52)'; c.font="500 12px 'Noto Sans SC'"; c.textAlign='right'; c.textBaseline='top';
  c.fillText('理论曲线 · 公式计算',CURVE.x1,CURVE.y0+38);
  c.restore();
}


/* ================= 90–100s 253 对：曲线点变形为 23 个人 ================= */
function nodePos(i,cx,cy,r){
  const a=-Math.PI/2 + i*Math.PI*2/23;
  return {x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r};
}

function drawNodeGraph(c,t,cx,cy,r,opts={}){
  const edgeCount=opts.edgeCount??253;
  const edgeAlpha=opts.edgeAlpha??1;
  const nodeAlpha=opts.nodeAlpha??1;
  const youMode=opts.youMode||'none'; /* none | highlight | only */
  const positions=opts.positions||PAIRS.map((_,i)=>nodePos(i,cx,cy,r));

  c.save(); c.globalAlpha*=edgeAlpha;
  for(let i=0;i<Math.min(edgeCount,PAIRS.length);i++){
    const [a,b]=PAIRS[i];
    const isYou=(a===YOU||b===YOU);
    if(youMode==='only' && !isYou) continue;
    const pa=nodePosPoint(a,opts), pb=nodePosPoint(b,opts);
    let color, lw, alpha;
    if(youMode==='highlight' && isYou){ color='#B53A2F'; lw=1.7; alpha=.78; }
    else if(youMode==='only'){ color='#B53A2F'; lw=1.4; alpha=.82; }
    else { color='#C9A96A'; lw=.75; alpha=.18; }
    if(opts.pulse && !isYou) alpha=.14+.18*Math.abs(Math.sin(t*1.25+i*.13));
    c.strokeStyle=rgba(color,alpha); c.lineWidth=lw;
    c.beginPath(); c.moveTo(pa.x,pa.y); c.lineTo(pb.x,pb.y); c.stroke();
  }
  c.restore();

  c.save(); c.globalAlpha*=nodeAlpha;
  for(let i=0;i<23;i++){
    const p=opts.positions?opts.positions[i]:nodePos(i,cx,cy,r);
    const you=i===YOU;
    const isGold=you && (youMode!=='none');
    c.shadowColor=isGold?rgba('#C9A96A',.55):'transparent'; c.shadowBlur=isGold?16:0;
    c.fillStyle=isGold?'#C9A96A':'#EDE4D3';
    c.strokeStyle=isGold?rgba('#F1D9A8',.95):rgba('#7FA6C8',.55); c.lineWidth=1.4;
    c.beginPath(); c.arc(p.x,p.y,you&&youMode!=='none'?9:6.5,0,Math.PI*2); c.fill(); c.stroke();
    c.shadowColor='transparent';
  }
  if(opts.labelYou){
    const p=opts.positions?opts.positions[YOU]:nodePos(YOU,cx,cy,r);
    c.fillStyle=CFG.accent; c.font="900 18px 'Noto Serif SC'"; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('你',p.x,p.y-24);
  }
  c.restore();
}

function nodePosPoint(i,opts){
  return opts.positions?opts.positions[i]:nodePos(i,opts.cx||850,opts.cy||380,opts.r||245);
}

function drawNodeStage(c,t){
  if(t<89.8 || t>=100.3) return;
  const fadeOut=1-clamp((t-99.7)/.6,0,1);
  const cx=840, cy=385, r=246;

  /* 90–92.5：曲线上的采样点飞成圆圈 */
  const morph=easeInOut(clamp((t-90)/2.0,0,1));
  const positions=Array.from({length:23},(_,i)=>{
    const n=2+i*3;
    const sx=curveX(n), sy=curveY(prob(n));
    const tx=nodePos(i,cx,cy,r).x, ty=nodePos(i,cx,cy,r).y;
    return {x:lerp(sx,tx,morph), y:lerp(sy,ty,morph)};
  });
  const edgeCount=t<91.2?0:(t>=94.85?253:Math.floor(clamp((t-91.2)/3.65,0,1)*253));
  const youMode=t>=97.4?'highlight':'none';

  c.save(); c.globalAlpha*=fadeOut;
  drawNodeGraph(c,t,cx,cy,r,{positions,edgeCount,youMode,pulse:t>=95,labelYou:t>=97.4});
  c.restore();

  /* 253 计数 */
  if(t>=91.2){
    const a=clamp((t-91.2)/.5,0,1)*fadeOut;
    c.save(); c.globalAlpha=a;
    drawPanel(c,1470,184,338,220,{stroke:'rgba(201,169,106,.20)'});
    c.textAlign='left'; c.textBaseline='top';
    c.fillStyle='rgba(138,138,160,.8)'; c.font="500 13px 'Noto Sans SC'";
    c.fillText('两两配对 · C(23,2)',1492,205);
    c.fillStyle=CFG.accent; c.font="900 72px 'Noto Serif SC'";
    c.fillText(String(edgeCount),1490,232);
    c.fillStyle='rgba(138,138,160,.75)'; c.font="500 15px 'Noto Sans SC'";
    c.fillText('对',1490+ (edgeCount>99?146:92),300);
    c.fillStyle='rgba(138,138,160,.56)'; c.font="500 12px 'Noto Sans SC'";
    c.fillText('23 个人 · 不是 23 次比较',1492,346);
    c.restore();
  }

  if(t>=95 && t<97.5){
    const a=clamp((t-95)/.4,0,1)*fadeOut;
    c.save(); c.globalAlpha=a;
    c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle='rgba(138,138,160,.75)'; c.font="500 14px 'Noto Sans SC'";
    c.fillText('每对 1/365　·　253/365 ≈ 69.3%（粗略上界，忽略重叠）',960,720);
    c.restore();
    /* 边上只闪一次极小的 1/365 */
    const pairsToShow=12;
    for(let k=0;k<pairsToShow;k++){
      const [a0,b0]=PAIRS[(k*21+7)%PAIRS.length];
      if(a0===YOU||b0===YOU) continue;
      const p=nodePos(a0,cx,cy,r), q=nodePos(b0,cx,cy,r);
      const x=(p.x+q.x)/2, y=(p.y+q.y)/2;
      const al=.22+.34*Math.abs(Math.sin(t*2.1+k*.9));
      c.save(); c.globalAlpha=al*a; c.fillStyle=rgba('#C9A96A',.9); c.font="500 10px 'EB Garamond', serif";
      c.textAlign='center'; c.textBaseline='middle'; c.fillText('1/365',x,y); c.restore();
    }
  }

  if(t>=97.5){
    const a=clamp((t-97.5)/.4,0,1)*fadeOut;
    c.save(); c.globalAlpha=a;
    c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle='rgba(181,58,47,.88)'; c.font="700 16px 'Noto Sans SC'";
    c.fillText('你 · 22 条红边',600,724);
    c.fillStyle='rgba(201,169,106,.82)'; c.font="500 15px 'Noto Sans SC'";
    c.fillText('其余 231 条金边',1290,724);
    c.restore();
  }
}

/* ================= 100–110s 两个问题 + 253 = 22 + 231 ================= */
function drawMiniNet(c,cx,cy,r,t,opt={}){
  const alpha=opt.alpha??1;
  c.save(); c.globalAlpha*=alpha;
  const youEdges=PAIRS.filter(([a,b])=>a===YOU||b===YOU);
  const edges=opt.onlyYou?youEdges:PAIRS;
  const prog=opt.edgeProgress??1;
  const nShow=Math.floor(edges.length*prog);
  for(let i=0;i<nShow;i++){
    const [a,b]=edges[i];
    const isYou=(a===YOU||b===YOU);
    const p=nodePos(a,cx,cy,r), q=nodePos(b,cx,cy,r);
    const red=opt.onlyYou && isYou;
    const color=red?'#B53A2F':'#C9A96A';
    const lw=red?1.8:.68;
    const goldA=(opt.goldAlpha??.20);
    let al=red?.82:goldA;
    if(opt.pulse) al=red?.82:(goldA*.72+.14*Math.abs(Math.sin(t*1.3+i*.1)));
    c.strokeStyle=rgba(color,al); c.lineWidth=lw;
    c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(q.x,q.y); c.stroke();
  }
  for(let i=0;i<23;i++){
    const p=nodePos(i,cx,cy,r);
    const isYou=i===YOU && opt.onlyYou;
    c.fillStyle=isYou?'#B53A2F':'#EDE4D3';
    c.strokeStyle=isYou?rgba('#F1D9A8',.9):rgba('#7FA6C8',.52); c.lineWidth=1.1;
    c.beginPath(); c.arc(p.x,p.y,isYou?7:4.8,0,Math.PI*2); c.fill(); c.stroke();
  }
  if(opt.onlyYou){
    const p=nodePos(YOU,cx,cy,r);
    c.fillStyle='rgba(181,58,47,.9)'; c.font="900 14px 'Noto Serif SC'"; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('你',p.x,p.y-18);
  }
  c.restore();
}

function drawComparisonStage(c,t){

  /* 左：和我同一天 / 22 条红边 */

  c.fillText('50.7%',1340,602);
  c.fillStyle='rgba(138,138,160,.72)'; c.font="500 14px 'Noto Sans SC'";

  c.restore();

  /* 105–107.5：主语换了，答案从 5.9% 跨到 50.7% */
  if(t>=105 && t<107.5){
    const a=clamp((t-105)/.4,0,1);

    c.fillStyle='rgba(181,58,47,.9)'; c.font="900 34px 'Noto Serif SC'";
    c.fillText('5.9%',790,720);
    c.fillStyle='rgba(138,138,160,.7)'; c.font="900 26px 'Noto Sans SC'";
    c.fillText('→',960,720);
    c.fillStyle=CFG.accent; c.font="900 34px 'Noto Serif SC'";
    c.fillText('50.7%',1130,720);
    c.restore();
  }

  /* 107.5–110：253 = 22 + 231 */
  if(t>=107.5){
    const a=clamp((t-107.5)/.55,0,1);
    c.save(); c.globalAlpha*=a*out;
    c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle=CFG.accent; c.font="900 76px 'Noto Serif SC'";
    c.fillText('253',480,300);
    c.fillStyle='rgba(138,138,160,.75)'; c.font="500 52px 'Noto Serif SC'";

    c.fillStyle='rgba(138,138,160,.75)'; c.font="500 16px 'Noto Sans SC'";
    c.fillText('你数了 22 对，漏了 231 对',960,380);

    /* 253 格长条：22 红 + 231 金 */
    const x0=276,y0=470,w=1368,h=48;

/* ================= 110–120s 教室 · 群聊 · 婚礼 ================= */

/* ================= 120–124.5s 末句：回到开场那面墙 ================= */

}


/* ================= 场景总调度 ================= */
function drawScene(t){
  NOW=t;
  ctScene.clearRect(0,0,1920,1080);

  if(t<13.2){
    if(t<3.9){
      const a=1-clamp((t-3.0)/.65,0,1);
      if(a>0) drawClassroom(ctScene,t,a);
    }
    if(t>=3.0 && t<8.7) drawHookWall(ctScene,t,1-clamp((t-7.9)/.8,0,1));
    if(t>=8.0) drawComparison(ctScene,t);
  }

  if(t>=20 && t<40) drawLiterature(ctScene,t);
  if(t>=40 && t<47.5) drawRuleStage(ctScene,t);
  if(t>=47.5 && t<63.5) drawFirstTrial(ctScene,t);
  if(t>=63.5 && t<73) drawThousand(ctScene,t);
  if(t>=72 && t<84) drawSixNumbers(ctScene,t);
  if(t>=82 && t<90.5) drawCurveChart(ctScene,t);
  if(t>=89.8 && t<100.3) drawNodeStage(ctScene,t);
  if(t>=99.8 && t<110.5) drawComparisonStage(ctScene,t);
  if(t>=110.0 && t<120.2) drawThreeScenes(ctScene,t);
  if(t>=120 && t<124.5) drawOutro(ctScene,t);
}

/* ================= DOM 覆盖层：章节、注释、双语字幕 ================= */
const $ = id => document.getElementById(id);
const elTop=$('toplabel'), elAnn=$('annotation'), elSub=$('subtitle'), elSubEn=$('subtitle-en');
const elTitle=$('titlecard'), elEnd=$('endcard');
const titleSeries=elTitle.querySelector('.series');
const titleName=elTitle.querySelector('.name');
const titleQ=elTitle.querySelector('.q');
const titleQEn=elTitle.querySelector('.q-en');

function sectionAt(t){
  let sec=SECTIONS[0];
  for(const s of SECTIONS) if(t>=s[0]) sec=s;
  return sec;
}

function drawOverlay(t){
  const tcIn = t>=TITLE_CARD[0] && t<TITLE_CARD[1];
  const endIn = t>=124.5;
  const sec=sectionAt(t);

  elTop.textContent = sec[1] || CFG.topic;
  elTop.style.opacity = tcIn||endIn?0:.78;
  elAnn.textContent = sec[2] || '';
  elAnn.style.opacity = tcIn||endIn?0:.78;

  const sub=SUBTITLES.find(([a,b])=>t>=a&&t<b);
  if(sub && !tcIn && !endIn){
    const [a,b,zh,en]=sub;
    const kin=easeOut(clamp((t-a)/.38,0,1));
    const kout=1-easeInOut(clamp((t-(b-.34))/.34,0,1));
    const k=kin*kout;
    elSub.innerHTML=zh;
    elSubEn.textContent=en||'';
    elSub.style.opacity=k;
    elSubEn.style.opacity=k*.92;
    elSub.style.transform=`translateY(${lerp(8,0,kin)}px)`;
    elSubEn.style.transform=`translateY(${lerp(6,0,kin)}px)`;
  } else {
    elSub.innerHTML=''; elSubEn.textContent='';
  }

  if(tcIn){
    elTitle.style.display='flex';
    const aIn=easeOut(clamp((t-TITLE_CARD[0])/.7,0,1));
    const aOut=1-clamp((t-(TITLE_CARD[1]-.55))/.55,0,1);
    elTitle.style.opacity=aIn*aOut;
    titleSeries.style.opacity=clamp((t-13.2)/.6,0,1);
    titleName.style.opacity=clamp((t-13.5)/.7,0,1);
    titleName.style.transform=`scale(${lerp(.93,1,easeOut(clamp((t-13.5)/1.0,0,1)))})`;
    titleQ.style.opacity=clamp((t-14.1)/.7,0,1);
    titleQEn.style.opacity=clamp((t-14.6)/.7,0,1)*.85;
  } else {
    elTitle.style.display='none';
  }

  if(endIn){
    elEnd.style.display='flex';
    elEnd.style.opacity=easeOut(clamp((t-124.5)/.8,0,1));
  } else {
    elEnd.style.display='none';
  }
}

/* ================= 帧入口 ================= */
window.render = function(t){
  t=clamp(t,0,CFG.duration-.001);
  drawBG(t);
  drawScene(t);
  drawOverlay(t);
};
